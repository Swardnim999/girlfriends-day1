<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff7f0">
<title>Happy Girlfriend's Day 🌷</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%8C%B7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8F0; --blush:#FFE4DC; --peach:#FFD9B8; --coral:#FF8B7B;
    --rose:#F4A7B9; --rose2:#E06B91; --rose3:#D95E83;
    --lilac:#CDB8E0; --lilac2:#B79FD4;
    --plum:#4E2A45; --dusty:#8A5F7C; --deep:#3A2440; --gold:#DFA83E;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scrollbar-width:thin; scrollbar-color:var(--rose2) var(--cream); }
  html,body{ height:100%; }
  body{
    font-family:'Nunito',sans-serif;
    background:var(--cream); color:var(--deep);
    overflow-x:hidden; -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  ::selection{ background:var(--rose); color:#fff; }

  /* ============ backdrop image layers ============ */
  #backdrop, #vignette, #petals, #flash{ position:fixed; inset:0; pointer-events:none; }
  #backdrop{ z-index:0; }
  #backdrop::after{
    content:""; position:fixed; inset:0;
    background:linear-gradient(180deg, rgba(255,247,240,.42) 0%, rgba(255,247,240,0) 28%, rgba(255,247,240,0) 72%, rgba(255,247,240,.42) 100%);
  }
  .chapter-layer{
    position:absolute; inset:0;
    opacity:0; will-change:opacity;
  }
  .chapter-layer.kb{ will-change:opacity,transform; animation:drift 24s ease-in-out infinite alternate; }
  @keyframes drift{
    from{ transform:scale(1.02) translateY(0); }
    to  { transform:scale(1.09) translateY(-1.4%); }
  }
  .img-layer{
    position:absolute; inset:0;
    background-size:cover; background-position:center;
    opacity:0; transition:opacity 1s ease-in-out;
    will-change:opacity; backface-visibility:hidden;
  }
  .img-layer.on{ opacity:1; }
  #vignette{ z-index:1; background:radial-gradient(120% 95% at 50% 46%, transparent 55%, rgba(75,45,90,.16)); }
  body.reduced .chapter-layer{ animation:none; }

  /* ============ falling petals ============ */
  #petals{ z-index:2; opacity:.9; }

  /* ============ HUD ============ */
  #hud{
    position:fixed; top:0; left:0; right:0; z-index:40;
    display:flex; justify-content:center; align-items:flex-start;
    padding:18px 96px 0; pointer-events:none; user-select:none;
  }
  .brand-text{
    font-family:'Dancing Script',cursive; font-weight:700;
    font-size:clamp(26px,4.4vw,42px); line-height:1.05; color:var(--plum);
    text-shadow:0 1px 0 rgba(255,255,255,.7), 0 4px 18px rgba(255,255,255,.9);
  }
  .brand-flower{ margin-left:6px; display:inline-block; animation:wobble 3.2s ease-in-out infinite; }
  @keyframes wobble{ 0%,100%{ transform:rotate(0); } 25%{ transform:rotate(-10deg); } 75%{ transform:rotate(10deg); } }
  #together{
    position:fixed; top:22px; left:20px; z-index:40; pointer-events:none; user-select:none;
    display:flex; flex-direction:column; gap:2px; align-items:flex-start;
    font-size:12px; font-weight:800; letter-spacing:.02em; line-height:1.4; color:var(--plum);
    background:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.85);
    padding:8px 14px; border-radius:16px;
    box-shadow:0 4px 14px rgba(90,60,110,.12), inset 0 1px 0 #fff;
  }
  #together .t-since{ color:var(--plum); }
  #together .t-since b{ color:var(--rose3); }
  #together .t-days{ color:var(--dusty); }
  #together .t-days b{ color:var(--rose2); }
  #together.pop{ animation:countPop .6s cubic-bezier(.34,1.56,.64,1); }
  #pager{
    position:fixed; top:26px; right:22px; z-index:40; pointer-events:none; user-select:none;
    font-size:13px; font-weight:700; letter-spacing:.2em; color:var(--plum);
    text-shadow:0 1px 0 rgba(255,255,255,.7);
  }
  #scrollHint{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:40;
    text-align:center; pointer-events:none; user-select:none;
    font-size:12.5px; font-weight:700; letter-spacing:.24em; text-transform:uppercase; color:var(--plum);
    text-shadow:0 1px 0 rgba(255,255,255,.7);
    transition:opacity .8s ease;
  }
  #scrollHint .chev{ display:block; margin-top:6px; font-size:20px; animation:chevBounce 1.6s ease-in-out infinite; color:var(--coral); }
  @keyframes chevBounce{ 0%,100%{ transform:translateY(0); opacity:.7; } 50%{ transform:translateY(8px); opacity:1; } }
  body.reduced #scrollHint .chev{ animation:none; }

  /* ============ progress: the blooming flower ============ */
  #progress{
    position:fixed; right:16px; top:50%; transform:translateY(-50%); z-index:40;
    width:5px; height:36vh; min-height:120px;
    background:rgba(90,60,110,.20); border-radius:99px; pointer-events:none;
  }
  #progressFill{
    position:absolute; inset:auto 0 0 0; height:0%; border-radius:99px;
    background:linear-gradient(180deg, var(--lilac2), var(--rose) 55%, var(--coral));
    box-shadow:0 0 12px rgba(224,107,145,.7);
  }
  #bloomTip{
    position:absolute; left:50%; bottom:0%; width:44px; height:52px;
    transform:translate(-50%,58%) rotate(calc((1 - var(--bloom,0)) * -70deg)) scale(calc(.35 + var(--bloom,0) * .7));
    transform-origin:50% 88%;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='44'%20height='52'%20viewBox='0%200%2044%2052'%3E%3Cline%20x1='22'%20y1='30'%20x2='22'%20y2='52'%20stroke='%2389b878'%20stroke-width='4'/%3E%3Ccircle%20cx='22'%20cy='26'%20r='5'%20fill='%23dfa83e'/%3E%3Ccircle%20cx='22'%20cy='12'%20r='8'%20fill='%23f4a7b9'/%3E%3Ccircle%20cx='30'%20cy='20'%20r='8'%20fill='%23f4a7b9'/%3E%3Ccircle%20cx='28'%20cy='30'%20r='8'%20fill='%23f4a7b9'/%3E%3Ccircle%20cx='16'%20cy='30'%20r='8'%20fill='%23f4a7b9'/%3E%3Ccircle%20cx='14'%20cy='20'%20r='8'%20fill='%23f4a7b9'/%3E%3C/svg%3E");
    background-size:contain; background-repeat:no-repeat; background-position:center top;
    filter:drop-shadow(0 4px 10px rgba(224,107,145,.5));
  }

  /* ============ scroll track & chapters ============ */
  #track{ position:relative; z-index:10; }
  .chapter{
    position:relative; height:100vh; height:100svh; min-height:600px;
    display:flex; align-items:center; justify-content:center;
    will-change:opacity;
  }
  .num{
    position:absolute; left:7%; top:15%;
    font-family:'Dancing Script',cursive; font-weight:700;
    font-size:clamp(90px,22vw,200px); line-height:1; color:var(--plum);
    opacity:calc(var(--v,0) * .10); pointer-events:none; user-select:none;
    transform:translateY(calc((1 - var(--v,0)) * -16px));
  }
  .card{
    position:relative; width:min(580px, 90vw); text-align:center;
    padding:46px 42px 50px; margin:0 20px;
    background:rgba(255,255,255,.42);
    border:1px solid rgba(255,255,255,.8);
    border-radius:30px;
    backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 24px 60px rgba(90,60,110,.20), inset 0 1px 0 #fff;
    opacity:var(--v,0);
    transform:translateY(calc((1 - var(--v,0)) * 46px)) scale(calc(.95 + var(--v,0) * .05));
  }
  .card-flower{ font-size:26px; margin-bottom:16px; display:inline-block; animation:wobble 3.6s ease-in-out infinite; filter:drop-shadow(0 0 12px rgba(224,107,145,.30)); }
  .chapter-title{
    font-family:'Dancing Script',cursive; font-weight:700;
    font-size:clamp(40px,7vw,68px); line-height:1.05; color:var(--plum); margin-bottom:14px;
    text-shadow:0 2px 16px rgba(255,255,255,.9);
  }
  .chapter-caption{
    font-size:clamp(15px,2.4vw,19px); font-weight:800; color:var(--rose3);
    letter-spacing:.01em; margin-bottom:10px;
  }
  .chapter-msg{ font-size:clamp(14px,2.1vw,16.5px); font-weight:600; line-height:1.7; color:rgba(90,60,110,.8); max-width:46ch; margin:0 auto; }

  /* ============ typewriter letter ============ */
  .letter-scroll{
    margin-top:12px;
    max-height:42vh; min-height:160px;
    overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    padding:2px 10px 6px 2px;
    -webkit-mask-image:linear-gradient(180deg, transparent 0, #000 16px, #000 calc(100% - 18px), transparent 100%);
    mask-image:linear-gradient(180deg, transparent 0, #000 16px, #000 calc(100% - 18px), transparent 100%);
    scrollbar-width:thin; scrollbar-color:rgba(224,107,145,.55) rgba(224,107,145,.12);
  }
  .letter-scroll::-webkit-scrollbar{ width:4px; }
  .letter-scroll::-webkit-scrollbar-thumb{ background:rgba(224,107,145,.5); border-radius:99px; }
  .letter-scroll::-webkit-scrollbar-track{ background:transparent; }
  .letter{
    font-family:'Nunito',sans-serif; font-weight:600;
    font-size:clamp(15px,2.2vw,17.5px); line-height:1.8; color:var(--deep);
    white-space:pre-line; text-align:left; margin:0 auto; max-width:52ch;
  }

  /* ============ finale: closing page ============ */
  .finale-card .card-flower{ font-size:44px; margin-bottom:24px; }
  .closing-greet{
    font-family:'Dancing Script',cursive; font-weight:700;
    font-size:clamp(32px,6.5vw,48px); line-height:1.1; color:var(--plum);
    margin-bottom:20px;
  }
  .closing-msg{
    font-family:'Nunito',sans-serif; font-weight:600;
    font-size:clamp(16px,2.4vw,19px); line-height:1.4; color:var(--deep);
    white-space:pre-line; text-align:center; margin:0 auto; max-width:40ch;
  }
  .closing-sign{
    font-family:'Dancing Script',cursive; font-weight:700;
    font-size:clamp(22px,4vw,30px); color:var(--rose3);
    margin-top:24px;
  }
  #finaleHeart.held{ animation:heldBeat .55s ease-in-out infinite; }
  @keyframes heldBeat{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.28); } }
  @keyframes countPop{ 0%{ transform:scale(1); } 40%{ transform:scale(1.2); } 100%{ transform:scale(1); } }
  .hug-msg, .bouquet-msg{
    margin-top:16px; font-size:14.5px; font-weight:700; color:var(--rose3);
    opacity:0; transform:translateY(8px); transition:opacity .5s ease, transform .5s ease;
    min-height:1.4em;
  }
  .hug-msg.show, .bouquet-msg.show{ opacity:1; transform:none; }

  #banner{
    position:fixed; left:50%; top:50%; z-index:66; transform:translate(-50%,-50%) scale(.6);
    font-family:'Dancing Script',cursive; font-weight:700;
    font-size:clamp(34px,7vw,64px); color:var(--plum); text-align:center;
    text-shadow:0 0 30px rgba(255,255,255,.95);
    opacity:0; pointer-events:none; transition:transform .5s cubic-bezier(.34,1.56,.64,1), opacity .5s ease;
  }
  #banner.pop{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  /* ============ cursor petal trail & flash ============ */
  #trail{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:60; }
  .trail-flower{ position:absolute; will-change:transform,opacity; filter:drop-shadow(0 3px 6px rgba(90,60,110,.25)); }
  #flash{
    z-index:70; background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.95), rgba(248,165,194,.55));
    opacity:0; transition:opacity .55s ease;
  }
  #flash.on{ opacity:1; }

  footer{
    position:relative; z-index:10; text-align:center;
    padding:14px 0 34px; font-size:12.5px; font-weight:700; letter-spacing:.18em; color:rgba(90,60,110,.55);
  }
  footer .f{ color:var(--rose2); }

  @media (max-width:640px){
    #pager{ right:12px; top:22px; font-size:11.5px; }
    #together{ top:auto; bottom:30px; left:12px; font-size:10.5px; padding:6px 10px; gap:1px; }
    #progress{ right:9px; width:4px; }
    .card{ padding:38px 26px 42px; }
    .num{ left:6%; top:12%; }
    #hud{ padding:16px 74px 0; }
    .letter-scroll{ max-height:38vh; scrollbar-width:none; }
    .letter-scroll::-webkit-scrollbar{ display:none; }
  }
  /* ============ ambient orbs (subtle depth) ============ */
  #ambience{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  #ambience i{
    position:absolute; border-radius:50%; opacity:.16; filter:blur(20px);
    animation:orbFloat ease-in-out infinite alternate; will-change:transform,opacity;
  }
  @keyframes orbFloat{
    from{ transform:translate3d(0,0,0) scale(1); opacity:.10; }
    to  { transform:translate3d(34px,-42px,0) scale(1.06); opacity:.22; }
  }
  body.reduced #ambience i{ animation:none; opacity:.10; }

  /* ============ hidden memory hunt ============ */
  .mem{
    position:absolute; z-index:12;
    width:46px; height:46px; display:grid; place-items:center;
    font-size:20px; line-height:1; cursor:pointer; user-select:none;
    opacity:.4; filter:saturate(.85);
    transition:opacity .3s ease, transform .3s ease;
  }
  .mem:hover, .mem:focus-visible{ opacity:1; transform:scale(1.16); filter:none; }
  .mem:focus-visible{ outline:2px dashed var(--rose2); outline-offset:3px; border-radius:12px; }
  .mem-clock{ right:7%; bottom:15%; }
  .mem-lift{ right:10%; top:26%; }
  .mem-pig{ left:9%; bottom:16%; }
  .mem-star{ left:12%; top:24%; }
  .mem-sun{ right:8%; bottom:18%; }
  .mem-eye{ left:10%; top:30%; }
  .mem-voice{ left:20%; bottom:20%; }

  .wave{ display:flex; align-items:center; gap:2.5px; height:20px; }
  .mem-voice{ font-size:0; }
  .wave i{
    width:3px; border-radius:2px;
    background:linear-gradient(180deg, var(--rose2), var(--rose3));
    animation:wavePulse 1.15s ease-in-out infinite;
  }
  .wave i:nth-child(1){ height:6px;  animation-delay:0s;   }
  .wave i:nth-child(2){ height:13px; animation-delay:.15s;  }
  .wave i:nth-child(3){ height:19px; animation-delay:.3s;   }
  .wave i:nth-child(4){ height:12px; animation-delay:.45s;  }
  .wave i:nth-child(5){ height:7px;  animation-delay:.6s;   }
  @keyframes wavePulse{ 0%,100%{ transform:scaleY(.55); } 50%{ transform:scaleY(1.05); } }
  body.reduced .wave i{ animation:none; }

  .mem-pop{
    position:absolute; left:50%; bottom:calc(100% + 8px);
    transform:translate(-50%, 6px) scale(.94);
    width:max-content; max-width:min(240px,74vw); text-align:center;
    font-size:13px; font-weight:800; color:var(--plum); letter-spacing:.01em; line-height:1.45;
    background:rgba(255,255,255,.72); border:1px solid rgba(255,255,255,.92);
    padding:9px 14px; border-radius:15px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 10px 26px rgba(90,60,110,.18), inset 0 1px 0 #fff;
    opacity:0; pointer-events:none;
    transition:opacity .55s ease, transform .55s cubic-bezier(.22,1,.36,1);
  }
  .mem-pop.show{ opacity:1; transform:translate(-50%,0) scale(1); }
  .mem-pop.down{ bottom:auto; top:calc(100% + 8px); }

  .dance-pop{
    position:absolute; left:50%; top:73%; transform:translate(-50%, 10px);
    font-family:'Dancing Script',cursive; font-weight:700;
    font-size:clamp(22px,4vw,30px); color:var(--deep); white-space:nowrap;
    background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.8);
    padding:10px 20px; border-radius:18px;
    box-shadow:0 10px 26px rgba(90,60,110,.15);
    opacity:0; pointer-events:none;
    transition:opacity .9s ease, transform .9s ease;
  }
  .dance-pop.show{ opacity:1; transform:translate(-50%,0); }

  @media (max-width:640px){
    .mem{ font-size:17px; }
    .mem-clock{ right:5%; bottom:10%; }
    .mem-lift{ right:5%; top:12%; }
    .mem-pig{ left:5%; bottom:12%; }
    .mem-star{ left:5%; top:12%; }
    .mem-sun{ right:5%; bottom:8%; }
    .mem-eye{ left:5%; top:18%; }
    .mem-voice{ left:8%; bottom:26%; }
  }

  /* ============ soundtrack: floating music player ============ */
  #music{ position:fixed; right:18px; bottom:18px; z-index:45; pointer-events:none; }
  .music-open{
    position:relative; pointer-events:none;
    width:54px; height:54px; border-radius:50%;
    background:linear-gradient(135deg, var(--coral), var(--rose2)); color:#fff;
    font-size:22px; line-height:1; border:1px solid rgba(255,255,255,.75);
    box-shadow:0 12px 30px rgba(224,107,145,.45), inset 0 1px 0 rgba(255,255,255,.4);
    cursor:pointer;
    opacity:0; transform:translateY(14px) scale(.82);
    transition:opacity .9s ease, transform .9s cubic-bezier(.22,1,.36,1);
  }
  .music-open.revealed{ opacity:1; transform:none; pointer-events:auto; }
  .music-open:hover{ transform:translateY(-2px) scale(1.06); }
  .music-open:active{ transform:translateY(0) scale(.94); }
  .music-open::after{
    content:""; position:absolute; inset:-6px; border-radius:50%;
    border:2px solid var(--rose); opacity:0;
  }
  .music-open.revealed:not(.playing)::after{ animation:nudge 2.8s ease-out infinite; }
  @keyframes nudge{ 0%{ transform:scale(.82); opacity:.85; } 70%{ transform:scale(1.28); opacity:0; } 100%{ transform:scale(1.28); opacity:0; } }
  .music-label{
    position:absolute; right:64px; bottom:15px; white-space:nowrap;
    pointer-events:none;
    font-family:'Nunito',sans-serif; font-weight:800; font-size:12.5px; color:var(--plum);
    background:rgba(255,255,255,.72); border:1px solid rgba(255,255,255,.92);
    padding:8px 14px; border-radius:14px;
    box-shadow:0 8px 22px rgba(90,60,110,.16), inset 0 1px 0 #fff;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    opacity:0; transform:translateX(10px);
    transition:opacity .9s ease, transform .9s cubic-bezier(.22,1,.36,1);
  }
  .music-label.revealed{ opacity:1; transform:none; }
  .music-panel{
    position:absolute; right:0; bottom:calc(100% + 12px);
    width:min(320px, calc(100vw - 36px));
    pointer-events:auto;
    background:rgba(255,255,255,.62);
    border:1px solid rgba(255,255,255,.92);
    border-radius:22px; padding:16px 18px 14px;
    backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 24px 60px rgba(90,60,110,.22), inset 0 1px 0 #fff;
    opacity:0; visibility:hidden; transform:translateY(14px) scale(.96); transform-origin:bottom right;
    transition:opacity .45s ease, transform .45s cubic-bezier(.22,1,.36,1), visibility .45s;
  }
  .music-panel.open{ opacity:1; visibility:visible; transform:none; }
  .music-close{
    position:absolute; top:8px; right:10px;
    width:26px; height:26px; border:none; background:transparent; cursor:pointer;
    color:var(--dusty); font-size:15px; line-height:1; border-radius:8px;
  }
  .music-close:hover{ background:rgba(90,60,110,.08); }
  .mp-title{
    font-family:'Dancing Script',cursive; font-weight:700;
    font-size:21px; line-height:1.2; color:var(--plum);
    margin:2px 26px 2px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .mp-sub{ font-size:11.5px; font-weight:800; color:var(--dusty); margin-bottom:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mp-row{ display:flex; align-items:center; gap:4px; margin-bottom:12px; }
  .mp-btn{
    width:34px; height:34px; flex:none;
    display:grid; place-items:center;
    border:none; background:transparent; border-radius:50%; cursor:pointer;
    font-size:13px; color:var(--plum);
    transition:background .2s ease, transform .2s ease;
  }
  .mp-btn:hover{ background:rgba(90,60,110,.09); transform:scale(1.1); }
  .mp-btn:active{ transform:scale(.94); }
  .mp-play{
    width:42px; height:42px; font-size:14px; color:#fff;
    background:linear-gradient(135deg, var(--coral), var(--rose2));
    box-shadow:0 8px 20px rgba(224,107,145,.4), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .mp-play:hover{ background:linear-gradient(135deg, var(--coral), var(--rose2)); transform:scale(1.07); }
  .mp-eq{ display:flex; align-items:flex-end; gap:2.5px; height:18px; margin-left:auto; margin-right:4px; }
  .mp-eq i{ width:3px; border-radius:2px; background:linear-gradient(180deg, var(--rose2), var(--rose3)); height:8px; animation:eqB 1.05s ease-in-out infinite; }
  .mp-eq i:nth-child(2){ height:15px; animation-delay:.18s; }
  .mp-eq i:nth-child(3){ height:11px; animation-delay:.34s; }
  .mp-eq i:nth-child(4){ height:16px; animation-delay:.08s; }

  }

  @media (prefers-reduced-motion:reduce){

      fillEl.style.width = d ? ((el.currentTime / d) * 100).toFixed(2) + '%' : '0%';
    }
    function syncUI(){
      playBtn.textContent = playing ? '⏸' : '▶';
      playBtn.setAttribute('aria-label', playing ? 'pause' : 'play');
      eqEl.classList.toggle('idle', !playing);
      musicOpen.classList.toggle('playing', playing);
      songBtns.forEach((b, i) => b.classList.toggle('active', i === songIdx));
      muteBtn.textContent = muted ? '🔇' : '🔊';
      volEl.value = Math.round(vol * 100);
      titleEl.textContent = started ? (playing ? 'now playing' : 'paused') : '🎵 Press Play, Bubu ❤️';
      subEl.textContent = started ? '🎵 ' + SONGS[songIdx].title : 'A little soundtrack for our story.';
      if (revealDone && !opened) {
        musicLabel.textContent = playing ? '♪ ' + SONGS[songIdx].title : '🎵 Press Play, Bubu ❤️';
        musicLabel.classList.add('revealed');
      }
    }
    function saveState(){
      try { localStorage.setItem(STORE, JSON.stringify({ song: songIdx, pos: savedPos[songIdx], vol: vol, muted: muted, playing: playing })); }
      catch (_) {}
    }
    function showMsg(t){
      if (!msgEl) return;
      msgEl.textContent = t;
      msgEl.classList.remove('show');
      void msgEl.offsetWidth;
      msgEl.classList.add('show');
      clearTimeout(msgTimer);
      msgTimer = setTimeout(() => msgEl.classList.remove('show'), 4600);
    }
    function revealMusic(){
      if (revealDone) return;
      revealDone = true;
      clearTimeout(revealTimer);
      musicOpen.classList.add('revealed');
      musicLabel.classList.add('revealed');
      A[songIdx].preload = 'metadata';
      try { A[songIdx].load(); } catch (_) {}
    }
    function openPanel(on){
      opened = on;
      musicPanel.classList.toggle('open', on);
      musicPanel.setAttribute('aria-hidden', String(!on));
      if (on) musicLabel.classList.remove('revealed');
      else if (revealDone) musicLabel.classList.add('revealed');
    }
    function doPlay(){
      if (playing) { doPause(); return; }
      const el = A[songIdx];
      if (el.ended) el.currentTime = 0;
      el.volume = 0;
      const p = el.play();
      if (p && p.then) p.then(() => {
        playing = true;
        fadeTo(el, muted ? 0 : vol, 1500);
        if (!started) { started = true; showMsg('Some memories deserve a soundtrack. ❤️'); }
        syncUI();
      }).catch(() => { playing = false; syncUI(); });
      else { playing = true; fadeTo(el, muted ? 0 : vol, 1500); if (!started) { started = true; showMsg('Some memories deserve a soundtrack. ❤️'); } syncUI(); }
    }
    function doPause(){
      if (!playing) return;
      playing = false;
      const el = A[songIdx];
      savedPos[songIdx] = el.currentTime;
      fadeTo(el, 0, 1500, () => { if (!playing) el.pause(); });
      syncUI();
      saveState();
    }
    function switchSong(s){
      if (s === songIdx) return;
      savedPos[songIdx] = A[songIdx].currentTime;
      const from = A[songIdx], to = A[s];
      songIdx = s;
      if (savedPos[s] > 0 && !to.ended) { try { to.currentTime = savedPos[s]; } catch (_) {} }
      if (playing) {
        to.volume = 0;
        const p = to.play();
        if (p && p.then) p.then(() => {
          fadeTo(from, 0, 1100, () => { if (playing && songIdx === s) from.pause(); });
          fadeTo(to, muted ? 0 : vol, 1100);
          syncUI(); syncProg();
        }).catch(() => { playing = false; syncUI(); });
      } else {
        from.pause(); to.pause();
        syncUI(); syncProg();
      }
    }
    function onEnded(){
      playing = false;
      savedPos[songIdx] = 0;
      showMsg('The song ended... but my favourite part is still us.');
      syncUI();
      saveState();
    }

    playBtn.addEventListener('click', doPlay);
    prevBtn.addEventListener('click', () => switchSong((songIdx + SONGS.length - 1) % SONGS.length));
    nextBtn.addEventListener('click', () => switchSong((songIdx + 1) % SONGS.length));
    muteBtn.addEventListener('click', () => { muted = !muted; applyVol(); syncUI(); saveState(); });
    volEl.addEventListener('input', () => { vol = clamp01(volEl.value / 100); applyVol(); syncUI(); saveState(); });
    barEl.addEventListener('click', e => {
      const r = barEl.getBoundingClientRect();
      if (!r.width) return;
      const el = A[songIdx];
      try { el.currentTime = clamp01((e.clientX - r.left) / r.width) * (el.duration || 0); } catch (_) {}
      syncProg();
    });
    songBtns.forEach((b, i) => b.addEventListener('click', () => { switchSong(i); if (!playing) doPlay(); }));
    musicOpen.addEventListener('click', () => openPanel(true));
    closeBtn.addEventListener('click', () => openPanel(false));

    A[0].addEventListener('ended', onEnded);
    A[1].addEventListener('ended', onEnded);
    const onTime = e => {
      if (playing && A[songIdx] === e.target) {
        syncProg();
        if (performance.now() - lastSave > 5000) { lastSave = performance.now(); savedPos[songIdx] = e.target.currentTime; saveState(); }
      }
    };
    A[0].addEventListener('timeupdate', onTime);
    A[1].addEventListener('timeupdate', onTime);
    A.forEach(a => a.addEventListener('loadedmetadata', () => { if (A[songIdx] === a) syncProg(); }));

    window.addEventListener('scroll', () => { if (!revealDone && window.scrollY > window.innerHeight * 0.4) revealMusic(); }, { passive: true });
    const revealTimer = setTimeout(revealMusic, 7000);

    function onGesture(e){
      if (e.target && e.target.closest && e.target.closest('#music')) return;
      if (shouldResume) {
        shouldResume = false;
        doPlay();
        window.removeEventListener('pointerdown', onGesture);
        window.removeEventListener('keydown', onGesture);
      }
    }
    window.addEventListener('pointerdown', onGesture);
    window.addEventListener('keydown', onGesture);

    window.addEventListener('beforeunload', () => { savedPos[songIdx] = A[songIdx].currentTime; saveState(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { savedPos[songIdx] = A[songIdx].currentTime; saveState(); } });

    /* restore remembered state (song, position, volume, was-playing) */
    try {
      const s = JSON.parse(localStorage.getItem(STORE));
      if (s && typeof s === 'object') {
        songIdx = s.song === 1 ? 1 : 0;
        if (typeof s.vol === 'number') vol = clamp01(s.vol);
        muted = !!s.muted;
        savedPos[songIdx] = Math.max(0, s.pos || 0);
        shouldResume = !!s.playing;
        const el = A[songIdx];
        if (savedPos[songIdx] > 0) { try { el.currentTime = savedPos[songIdx]; } catch (_) {} }
        applyVol();
        syncUI();
      }
    } catch (_) {}

    applyVol();
    syncUI();
    syncProg();
  }
  initMusic();

  /* ---------------- init ---------------- */
  if (banner) banner.textContent = '💐 Happy Girlfriend\'s Day, ' + HER_NAME + '! 💐';
  measure();
  sizeCanvas();
  seedPetals();
  animateDays();
  initAmbience();
  if (!reduced) requestAnimationFrame(tick);
  onScroll();

  window.addEventListener('resize', () => {
    measure();
    sizeCanvas();
    seedPetals();
    dpr = Math.min(2, window.devicePixelRatio || 1);
  });
})();
</script>
</body>
</html>
